name: Build and Push Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag name (e.g. v1.0.0)'
        required: true
        default: 'manual'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: privileged
            suffix: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: privileged
            suffix: ''
          - arch: amd64
            runner: ubuntu-latest
            target: unprivileged
            suffix: '-unprivileged'
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: unprivileged
            suffix: '-unprivileged'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          # Use the tag from the release event, or the manual input if triggered manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          file: ./Containerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ env.RELEASE_TAG }}${{ matrix.suffix }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          
          # Determine secondary tag (latest vs rc)
          # Note: If triggered manually, we default to 'rc' to be safe
          if [ "${{ github.event.release.prerelease }}" = "false" ]; then
            SECONDARY_TAG="latest"
          else
            SECONDARY_TAG="rc"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
             TAG_NAME="${GITHUB_REF##*/}"
          fi

          create_manifest() {
            SUFFIX="$1"
            echo "Pushing manifest for ${TAG_NAME}${SUFFIX} and ${SECONDARY_TAG}${SUFFIX}..."
            docker buildx imagetools create \
              --tag "${REPO}:${TAG_NAME}${SUFFIX}" \
              --tag "${REPO}:${SECONDARY_TAG}${SUFFIX}" \
              "${REPO}:${TAG_NAME}${SUFFIX}-amd64" \
              "${REPO}:${TAG_NAME}${SUFFIX}-arm64"
          }

          create_manifest ''
          create_manifest '-unprivileged'
